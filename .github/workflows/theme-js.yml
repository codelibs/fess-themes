# Runs the theme JavaScript unit tests, which live under test/ with their own
# package.json and npm test script. verify-bundles.yml checks only the locale-
# bundle contract; these tests exercise the shared core modules, and they need
# Node + npm, so they get their own job.
name: Theme JS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only: this job installs dependencies and runs tests; it never writes.
permissions:
  contents: read

jobs:
  theme-js:
    name: Run Theme JS Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: test/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run theme JS tests
      run: npm test
