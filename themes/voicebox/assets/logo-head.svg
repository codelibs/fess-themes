<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 28" width="132" height="28">
  <!-- VoiceBox header masthead logo: white wordmark on black header, single red accent -->
  <rect width="132" height="28" fill="none"/>
  <!-- "VOICE" in white -->
  <text
    x="2"
    y="21"
    font-family="'Arial Black', Impact, sans-serif"
    font-weight="900"
    font-size="20"
    fill="#FAFAFA"
    letter-spacing="-0.5">VOICE</text>
  <!-- Red accent box behind "BOX" -->
  <rect x="84" y="2" width="46" height="24" fill="#EF4444"/>
  <!-- "BOX" in white inside the red box -->
  <text
    x="87"
    y="21"
    font-family="'Arial Black', Impact, sans-serif"
    font-weight="900"
    font-size="20"
    fill="#FAFAFA"
    letter-spacing="-0.5">BOX</text>
</svg>
