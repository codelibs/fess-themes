<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <!-- VoiceBox home hero logo: black wordmark on white/transparent, single red accent -->
  <rect width="280" height="60" fill="none"/>
  <!-- "VOICE" in black -->
  <text
    x="8"
    y="44"
    font-family="'Arial Black', Impact, sans-serif"
    font-weight="900"
    font-size="42"
    fill="#0A0A0A"
    letter-spacing="-1">VOICE</text>
  <!-- Red accent box behind "BOX" -->
  <rect x="181" y="6" width="91" height="48" fill="#EF4444"/>
  <!-- "BOX" in white inside the red box -->
  <text
    x="186"
    y="44"
    font-family="'Arial Black', Impact, sans-serif"
    font-weight="900"
    font-size="42"
    fill="#FAFAFA"
    letter-spacing="-1">BOX</text>
</svg>
